{% extends 'base.html' %}{% block content %}
<form class="box card" method="post" id="regForm"><h2>Register as Patient or Doctor</h2>
<label>Full Name</label><input name="full_name" required><label>Username</label><input name="username" required>
<label>Email</label><input type="email" name="email" required><label>Phone</label><input name="phone" pattern="[0-9]{10}" title="10 digits" required>
<label>Password</label><input type="password" name="password" required><label>Confirm Password</label><input type="password" name="confirm" required>
<label>Role</label><select name="role" id="role"><option value="patient">Patient</option><option value="doctor">Doctor</option></select>
<div id="patientFields"><label>Date of Birth</label><input type="date" name="dob"><label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select>
<label>Blood Group</label><input name="blood_group"><label>Emergency Contact</label><input name="emergency_contact"></div>
<div id="doctorFields"><label>Specialization</label><input name="specialization"><label>Qualification</label><input name="qualification">
<label>Experience (years)</label><input type="number" name="experience"><label>Consultation Fee</label><input type="number" name="fee"></div>
<button class="btn">Register</button></form>{% endblock %}
